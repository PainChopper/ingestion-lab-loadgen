schema_version = 2

[source]
path = 'D:\.DEV\ingestion-lab\ingestion-lab-loadgen\data\MBD-mini\trx\fold=*\*.parquet'
unit = "glob-pattern"
mutability = "startup-only"

[reader.read_batch_size]
default = 1_000
min = 1_000
max = 100_000
step = 1_000
unit = "transactions"
mutability = "idle-only"

[reader.workers]
default = 1
min = 1
max = 7
step = 1
unit = "workers"
mutability = "immediate"

[readerChannel.capacity]
default = 2
allowed = [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
unit = "batches"
mutability = "idle-only"

[senderChannel.capacity]
default = 0
allowed = [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
unit = "batches"
mutability = "idle-only"

[throttler.requested_tps]
default = 2_000_000
min = 0
max = 4_000_000
step = 200_000
unit = "transactions/s"
mutability = "immediate"

[throttler.installation_mode]
default = "installed"
allowed = ["installed", "bypass"]
mutability = "immediate"

[sender.workers]
default = 32
min = 1
max = 32
step = 1
unit = "workers"
mutability = "immediate"

[sender.api]
url = "http://127.0.0.1:8080/internal/test/ingest"
mutability = "startup-only"

[sender.retry]
max_attempts = 3
backoff_base_ms = 250
backoff_multiplier = 2
jitter_percent = 20
mutability = "startup-only"

[metrics.window_ms]
default = 1_000
min = 100
max = 10_000
step = 100
unit = "milliseconds"
mutability = "startup-only"
